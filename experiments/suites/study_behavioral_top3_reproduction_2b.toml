# Home reproduction of the historical runs required by the
# Top-3 multi-seed dose-response analysis.
#
# Final-analysis provenance:
# - seed0 non-7 doses use TOPK coarse
# - seed0 +7 for 30908/22552 uses FINE
# - +7 robustness uses ROBUST
# - FINE +4/+5/+6/+8 are not selected for the final fixed grid.
[suite]
name = "study_behavioral_top3_reproduction_2b"
configs = [
  "../configs/study_behavioral_topk_f30908_2b.toml",
  "../configs/study_behavioral_topk_f22552_2b.toml",
  "../configs/study_behavioral_topk_f14817_2b.toml",
  "../configs/study_behavioral_fine_f30908_2b.toml",
  "../configs/study_behavioral_fine_f22552_2b.toml",
  "../configs/study_behavioral_robust_f30908_seed1_2b.toml",
  "../configs/study_behavioral_robust_f30908_seed2_2b.toml",
  "../configs/study_behavioral_robust_f30908_seed3_2b.toml",
  "../configs/study_behavioral_robust_f30908_seed4_2b.toml",
  "../configs/study_behavioral_robust_f22552_seed1_2b.toml",
  "../configs/study_behavioral_robust_f22552_seed2_2b.toml",
  "../configs/study_behavioral_robust_f22552_seed3_2b.toml",
  "../configs/study_behavioral_robust_f22552_seed4_2b.toml",
  "../configs/study_behavioral_robust_f14817_seed0_2b.toml",
  "../configs/study_behavioral_robust_f14817_seed1_2b.toml",
  "../configs/study_behavioral_robust_f14817_seed2_2b.toml",
  "../configs/study_behavioral_robust_f14817_seed3_2b.toml",
  "../configs/study_behavioral_robust_f14817_seed4_2b.toml",
]
