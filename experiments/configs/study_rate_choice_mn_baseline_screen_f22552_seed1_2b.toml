# Pilot 5A: screen baseline letter saturation with a new letter pair.
# coefficient=0 is a no-intervention control; this is NOT a steering efficacy test.
[run]
name = "study_rate_choice_mn_baseline_screen_f22552_seed1_2b"
job = "research_experiments"

[experiment]
kind = "behavioral"

[model]
profile = "2b"
dtype = "auto"
device_map = "auto"
sae_device = "auto"
sae_dtype = "auto"

[data]
dataset = "crt_fresh_v2_rate_order_pilot"
limit_per_family = 0
train_frac = 0.6
split_seed = 1
instruction = true

[discover]
candidate_top_n = 10
min_active_cases = 3
max_candidates = 24
max_cases = 24               # family-balanced cap on train items used for discovery
coefficient = 1.0
intervention_mode = "remove_activation"
null_samples = 32

[feature]
layer = 5
feature_id = 22552

[behavioral]
coefficients = [0.0]
max_new_tokens = 16
case_pool = "all"
max_cases = 0               # deterministic family-balanced held-out subset
token_position = "all"
output_mode = "binary_choice_letter"
choice_letters = ["M", "N"]
choice_orders = ["correct_first", "lure_first"]
expected_cases = 20

[colab]
gpu = "A100"

[remote]
source = "archive"
repo_dir = "/content/mindscopex_analysis"
output_root = "/content/mindscopex_artifacts"
